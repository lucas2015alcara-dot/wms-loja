<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #111110; --tile: #1E1E1C; --line: #33332F; --yellow: #FFCC00; --red: #A3231A;
    --text: #FFFFFF; --dim: #8A8A84;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { color: var(--text); font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 2.6vh 3vw 2vh; flex: none; }
  header .brand { display: flex; align-items: center; gap: 1.1vw; }
  header .brandMark { width: clamp(44px, 4.4vw, 76px); height: clamp(44px, 4.4vw, 76px); border-radius: 50%; box-shadow: 0 0 0 4px var(--yellow); }
  header h1 { font-size: clamp(22px, 2.4vw, 42px); margin: 0; font-weight: 800; font-stretch: 118%; line-height: 1; }
  header .sub { font-size: clamp(13px, 1.1vw, 20px); color: var(--dim); margin-top: 4px; }
  header .clock { text-align: right; }
  #relogio { font-size: clamp(30px, 3.6vw, 64px); font-weight: 800; font-stretch: 110%; font-variant-numeric: tabular-nums; line-height: 1; }
  header .clock .date { font-size: clamp(13px, 1.1vw, 20px); color: var(--dim); margin-top: 6px; }
  header .clock .date::first-letter { text-transform: uppercase; }

  .board { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; gap: 1.6vw; padding: 0.6vh 3vw 2.4vh; min-height: 0; }
  .col { border-radius: 28px; display: flex; flex-direction: column; justify-content: space-between; padding: 3.2vh 2.4vw; position: relative; overflow: hidden; background: var(--tile); border: 1px solid var(--line); }
  .col .label { font-size: clamp(20px, 2.2vw, 40px); font-weight: 800; font-stretch: 112%; }
  .col .n { font-weight: 900; font-stretch: 125%; font-variant-numeric: tabular-nums; font-size: clamp(90px, 12vw, 240px); line-height: .85; letter-spacing: -0.02em; }
  .col .obs { font-size: clamp(13px, 1.15vw, 21px); font-weight: 600; opacity: .75; }
  .col .n.pulse { animation: pulse 0.6s ease; }
  @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .col .fim { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }

  /* A separar: o trabalho da vez, em amarelo */
  .col.wait { grid-row: span 2; background: var(--yellow); color: #1A1A1A; border-color: transparent; }
  .col.wait .n { font-size: clamp(140px, 20vw, 420px); }
  .col.wait::after { content: ""; position: absolute; right: -14vw; bottom: -14vw; width: 34vw; height: 34vw; border-radius: 50%; border: 4.2vw solid #1A1A1A; opacity: .08; }
  /* A embalar: branco */
  .col.emb { background: #FFFFFF; color: #1A1A1A; border-color: transparent; }
  /* Expedidos hoje: escuro com número branco e selo amarelo */
  .col.exp .label::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--yellow); margin-right: .45em; vertical-align: .05em; }
  /* Pendências: some quando zero, vira vermelho quando tem */
  .col.pend .n { color: var(--dim); }
  .col.pend.alerta { background: var(--red); border-color: transparent; animation: glow 1.6s ease-in-out infinite; }
  .col.pend.alerta .n { color: #FFFFFF; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(163,35,26,0); } 50% { box-shadow: 0 0 0 12px rgba(163,35,26,.35); } }

  /* pendências e expedidos dividem a coluna da direita embaixo */
  .lado { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vw; min-height: 0; }
  .lado .col .n { font-size: clamp(70px, 8vw, 170px); }

  footer { flex: none; padding: 0 3vw 2vh; display: flex; justify-content: space-between; font-size: clamp(12px, .95vw, 17px); color: var(--dim); }
  #status.err { color: #FF6B5E; font-weight: 700; }
</style>
</head>

      <h1>WMS · Pilchs Info</h1>
      <div class="sub">Operação em tempo real</div>
    </div>
  </div>
  <div class="clock">
    <div id="relogio">--:--:--</div>
    <div class="date" id="dataHoje">—</div>
  </div>
</header>

<div class="board">
  <div class="col wait">
    <div class="label">A separar</div>
    <div class="fim"><div class="n" id="nWait">0</div><div class="obs">pedidos esperando<br>separação</div></div>
  </div>
  <div class="col emb">
    <div class="label">A embalar</div>
    <div class="fim"><div class="n" id="nEmb">0</div><div class="obs">já separados,<br>na bancada</div></div>
  </div>
  <div class="lado">
    <div class="col pend" id="colPend">
      <div class="label">Pendências</div>
      <div class="n" id="nPend">0</div>
    </div>
    <div class="col exp">
      <div class="label">Expedidos hoje</div>
      <div class="n" id="nExp">0</div>
    </div>
  </div>
</div>

<footer>
  <span id="status">conectando…</span>
  <span>atualiza automaticamente a cada 20s</span>
</footer>

<script>
(function () {
  var SUPABASE_URL = "https://levnxrjcvqubfowvvurd.supabase.co";
  var SUPABASE_KEY = "sb_publishable_8Zox-r5ttwflMRl5MxtIqw_vXp9rEch";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function setNum(id, val) {
    var el = document.getElementById(id);
    if (el.textContent !== String(val)) {
      el.textContent = val;
      el.classList.remove("pulse");
      void el.offsetWidth;
      el.classList.add("pulse");
    }
  }

  function carregar() {
    var st = document.getElementById("status");
    Promise.all([
      sb.rpc("contagem_pedidos"),
      sb.rpc("contagem_pendencias"),
      sb.rpc("contagem_expedidos_hoje")
    ]).then(function (results) {
      var pedidosRes = results[0];
      var pendRes = results[1];
      var expHojeRes = results[2];
      if (pedidosRes.error || pendRes.error || expHojeRes.error) {
        st.textContent = "erro ao atualizar — tentando de novo…";
        st.className = "err";
        return;
      }
      st.textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR");
      st.className = "";

      var kv = { a_separar: 0, separado: 0, embalado: 0, expedido: 0 };
      (pedidosRes.data || []).forEach(function (r) { kv[r.status] = r.total; });
      setNum("nWait", kv.a_separar);
      setNum("nEmb", kv.separado);
      setNum("nExp", expHojeRes.data || 0); // só os expedidos hoje (horário de Brasília)

      var pend = pendRes.data || 0;
      setNum("nPend", pend);
      document.getElementById("colPend").classList.toggle("alerta", pend > 0);
    });
  }

  function atualizarRelogio() {
    var d = new Date();
    document.getElementById("relogio").textContent = d.toLocaleTimeString("pt-BR");
    document.getElementById("dataHoje").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  }

  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);

  carregar();
  setInterval(carregar, 20000);

  // recarrega a página inteira de tempos em tempos (TV fica ligada o dia todo)
  setInterval(function () { location.reload(); }, 60 * 60 * 1000);
})();
</script>
