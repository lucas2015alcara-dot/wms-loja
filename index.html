<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMS — Separação, Embalagem &amp; Expedição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #12161a; --surface: #1b2127; --surface-2: #242b32; --line: #313a42;
    --accent: #f2a93b; --blue: #4fa6d8; --green: #4caf6d; --red: #e2544f;
    --text: #e8eaed; --text-dim: #8b95a1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  #btnLogout { background: none; border: 1px solid var(--line); color: var(--text-dim); font-size: 12px; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: inherit; }

  .counters { display: flex; gap: 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .counter { flex: 1; min-width: 70px; text-align: center; background: var(--surface-2); border-radius: 8px; padding: 6px 4px; }
  .counter .n { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; }
  .counter .l { font-size: 9.5px; color: var(--text-dim); margin-top: 1px; }

  nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { flex: 1; min-width: 84px; background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 12px 6px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 40px; }
  .view { display: none; max-width: 640px; margin: 0 auto; }
  .view.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 13px; color: var(--text-dim); font-weight: 600; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=password], input[type=email] { width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: inherit; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  button.btn { font-family: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); padding: 11px 14px; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #16130a; }
  button.btn.ghost { background: none; }
  button.btn.danger { color: var(--red); border-color: var(--red); background: none; }
  button.btn.small { padding: 6px 10px; font-size: 12px; }
  button.btn:active { transform: scale(0.98); }
  button.btn:disabled { opacity: 0.4; cursor: default; }

  .item-line { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .item-line:last-child { border-bottom: none; }
  .item-line button.rm { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 2px 6px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.wait { background: #3a3020; color: var(--accent); }
  .badge.sep { background: #1e3546; color: var(--blue); }
  .badge.emb { background: #21382b; color: var(--green); }
  .badge.exp { background: #2a2a2a; color: var(--text-dim); }

  .order-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface-2); cursor: pointer; }
  .order-row .oid { font-weight: 700; font-size: 14px; }
  .order-row .meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 30px 10px; }

  .scan-box { background: var(--surface-2); border: 2px solid var(--accent); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 14px; }
  .scan-box input { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 18px; }
  .scan-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; }

  .pick-item { padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--line); background: var(--surface-2); }
  .pick-item.done { border-color: var(--green); background: #1a2620; }
  .pick-item .top { display: flex; justify-content: space-between; align-items: center; }
  .pick-item .name { font-size: 13.5px; font-weight: 600; }
  .pick-item .sku { font-size: 11.5px; color: var(--text-dim); }
  .pick-item .qty { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .pick-item .qty .done-c { color: var(--green); }
  .pick-item .alerta-btn { margin-top: 8px; font-size: 11px; color: var(--red); background: none; border: 1px solid var(--red); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
  .alerta-tag { font-size: 11px; color: var(--red); margin-top: 6px; }

  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .kcol { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .kcol .n { font-size: 22px; font-weight: 800; font-family: 'IBM Plex Mono', monospace; }
  .kcol .l { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  @media (max-width: 420px) { .kanban { grid-template-columns: repeat(2, 1fr); } }

  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }

  #loginScreen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #loginScreen .card { width: 100%; max-width: 340px; }
  #loginScreen h1 { font-size: 18px; margin: 0 0 4px; }
  #loginScreen .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
  #loginErr { color: var(--red); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  #appShell { display: none; flex-direction: column; flex: 1; min-height: 0; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h1>WMS — acesso</h1>
    <div class="sub">Entre com seu login cadastrado pelo admin.</div>
    <label for="loginEmail">E-mail</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label for="loginSenha">Senha</label>
    <input type="password" id="loginSenha" autocomplete="current-password">
    <button class="btn primary" id="btnLogin" style="width:100%; margin-top:16px">Entrar</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="appShell">
  <header>
    <div>
      <h1 id="hUser">—</h1>
      <div class="sub" id="hPapel">—</div>
    </div>
    <button id="btnLogout">Sair</button>
  </header>

  <div class="counters" id="counters"></div>

  <nav id="navBar"></nav>

  <main>
    <div class="view" id="view-pedidos">
      <div class="card">
        <h2>Novo pedido</h2>
        <div class="row">
          <div style="flex:2"><label>ID / nº do pedido</label><input type="text" id="npId"></div>
          <div><label>Canal</label>
            <select id="npCanal" style="width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; font-family:inherit; font-size:15px">
              <option value="mercado_livre">Mercado Livre</option>
              <option value="shopee">Shopee</option>
              <option value="olist">Olist</option>
              <option value="site_proprio">Site próprio</option>
              <option value="outro">Outro</option>
            </select>
          </div>
        </div>
        <label>Itens do pedido</label>
        <div id="npItems"></div>
        <div class="row" style="margin-top:8px">
          <input type="text" id="npSku" placeholder="SKU">
          <input type="text" id="npNome" placeholder="Nome (se produto novo)">
          <input type="number" id="npQtd" placeholder="Qtd" min="1" value="1" style="max-width:70px">
        </div>
        <button class="btn ghost" id="npAddItem" style="margin-top:8px; width:100%">+ adicionar item</button>
        <button class="btn primary" id="npSalvar" style="margin-top:10px; width:100%">Criar pedido</button>
      </div>
      <div class="card">
        <h2>Fila — a separar</h2>
        <div id="listaPedidos"></div>
      </div>
    </div>

    <div class="view" id="view-separacao">
      <div class="card" id="sepSelectCard"><h2>Escolha um pedido para separar</h2><div id="sepFila"></div></div>
      <div id="sepAtivo" style="display:none"></div>
    </div>

    <div class="view" id="view-embalagem">
      <div class="card" id="embSelectCard"><h2>Escolha um pedido para embalar</h2><div id="embFila"></div></div>
      <div id="embAtivo" style="display:none"></div>
    </div>

    <div class="view" id="view-expedicao">
      <div class="card"><h2>Pedidos embalados — pronto pra expedir</h2><div id="expFila"></div></div>
    </div>

    <div class="view" id="view-painel">
      <div class="kanban">
        <div class="kcol"><div class="n mono" id="kWait">0</div><div class="l">A separar</div></div>
        <div class="kcol"><div class="n mono" id="kSep">0</div><div class="l">Separado</div></div>
        <div class="kcol"><div class="n mono" id="kEmb">0</div><div class="l">Embalado</div></div>
        <div class="kcol"><div class="n mono" id="kExp">0</div><div class="l">Expedido</div></div>
      </div>
      <div class="card" id="alertasCard" style="display:none">
        <h2>Alertas de estoque</h2>
        <div id="listaAlertas"></div>
      </div>
      <div class="card">
        <h2>Todos os pedidos</h2>
        <div id="painelLista"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://levnxrjcvqubfowvvurd.supabase.co";
  var SUPABASE_KEY = "sb_publishable_8Zox-r5ttwflMRl5MxtIqw_vXp9rEch";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = "toast"; }, 1900);
  }
  function escapeHtml(s) {
    return (s || "").toString().replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function statusLabel(s) { return { a_separar: "A separar", separado: "Separado", embalado: "Embalado", expedido: "Expedido" }[s] || s; }
  function statusBadge(s) { return { a_separar: "wait", separado: "sep", embalado: "emb", expedido: "exp" }[s] || ""; }
  function canalLabel(c) { return { mercado_livre: "Mercado Livre", shopee: "Shopee", olist: "Olist", site_proprio: "Site próprio", outro: "Outro" }[c] || c; }

  var meu = null; // { id, nome, papel }

  // ---------------- LOGIN ----------------
  document.getElementById("btnLogin").addEventListener("click", fazerLogin);
  document.getElementById("loginSenha").addEventListener("keydown", function (e) { if (e.key === "Enter") fazerLogin(); });

  function fazerLogin() {
    var email = document.getElementById("loginEmail").value.trim();
    var senha = document.getElementById("loginSenha").value;
    var errEl = document.getElementById("loginErr");
    errEl.textContent = "";
    if (!email || !senha) { errEl.textContent = "Preencha e-mail e senha."; return; }
    sb.auth.signInWithPassword({ email: email, password: senha }).then(function (res) {
      if (res.error) { errEl.textContent = "Login inválido. Confira e-mail e senha."; return; }
      carregarPerfilEIniciar();
    });
  }

  document.getElementById("btnLogout").addEventListener("click", function () {
    sb.auth.signOut().then(function () { location.reload(); });
  });

  function carregarPerfilEIniciar() {
    sb.auth.getUser().then(function (r) {
      var user = r.data.user;
      if (!user) return;
      sb.from("perfis").select("id,nome,papel").eq("id", user.id).single().then(function (res) {
        if (res.error || !res.data) { toast("Não foi possível carregar seu perfil.", "err"); return; }
        meu = res.data;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appShell").style.display = "flex";
        document.getElementById("hUser").textContent = meu.nome;
        document.getElementById("hPapel").textContent = { admin: "Admin", separador: "Separador", embalador: "Embalador", expedicao: "Expedição" }[meu.papel] || meu.papel;
        montarNav();
        carregarContadores();
      });
    });
  }

  // checa sessão já existente ao abrir
  sb.auth.getSession().then(function (r) { if (r.data.session) carregarPerfilEIniciar(); });

  // ---------------- NAV ----------------
  var TABS = {
    admin: [["pedidos", "Pedidos"], ["separacao", "Separar"], ["embalagem", "Embalar"], ["expedicao", "Expedir"], ["painel", "Painel"]],
    separador: [["separacao", "Separar"], ["painel", "Painel"]],
    embalador: [["embalagem", "Embalar"], ["painel", "Painel"]],
    expedicao: [["expedicao", "Expedir"], ["painel", "Painel"]]
  };
  function montarNav() {
    var tabs = TABS[meu.papel] || [["painel", "Painel"]];
    var nav = document.getElementById("navBar");
    nav.innerHTML = "";
    tabs.forEach(function (t, i) {
      var b = document.createElement("button");
      b.textContent = t[1];
      b.dataset.view = t[0];
      if (i === 0) b.classList.add("active");
      b.addEventListener("click", function () { showView(t[0]); });
      nav.appendChild(b);
    });
    showView(tabs[0][0]);
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-" + name).classList.add("active");
    document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("active", b.dataset.view === name); });
    if (name === "pedidos") { renderNpItems(); carregarFilaPedidos(); }
    if (name === "separacao") carregarFilaSeparacao();
    if (name === "embalagem") carregarFilaEmbalagem();
    if (name === "expedicao") carregarFilaExpedicao();
    if (name === "painel") carregarPainel();
    carregarContadores();
  }

  // ---------------- CONTADOR GERAL ----------------
  function carregarContadores() {
    sb.rpc("contagem_pedidos").then(function (res) {
      var el = document.getElementById("counters");
      var kv = { a_separar: 0, separado: 0, embalado: 0, expedido: 0 };
      if (!res.error && res.data) res.data.forEach(function (r) { kv[r.status] = r.total; });
      el.innerHTML = "";
      [["a_separar", "A separar"], ["separado", "Separado"], ["embalado", "Embalado"], ["expedido", "Expedido"]].forEach(function (p) {
        var d = document.createElement("div");
        d.className = "counter";
        d.innerHTML = '<div class="n">' + kv[p[0]] + '</div><div class="l">' + p[1] + '</div>';
        el.appendChild(d);
      });
      document.getElementById("kWait").textContent = kv.a_separar;
      document.getElementById("kSep").textContent = kv.separado;
      document.getElementById("kEmb").textContent = kv.embalado;
      document.getElementById("kExp").textContent = kv.expedido;
    });
  }

  // ---------------- PEDIDOS (admin cria) ----------------
  var npItemsBuffer = [];
  function renderNpItems() {
    var el = document.getElementById("npItems");
    el.innerHTML = "";
    if (npItemsBuffer.length === 0) {
      el.innerHTML = '<div class="empty" style="padding:10px">Nenhum item adicionado ainda.</div>';
      return;
    }
    npItemsBuffer.forEach(function (it, idx) {
      var row = document.createElement("div");
      row.className = "item-line";
      row.innerHTML = '<span class="mono" style="min-width:26px">' + it.qtd + 'x</span>' +
        '<span style="flex:1">' + escapeHtml(it.nome || it.sku) + '<br><span style="color:var(--text-dim);font-size:11px">' + escapeHtml(it.sku) + '</span></span>' +
        '<button class="rm" data-idx="' + idx + '" aria-label="remover">✕</button>';
      el.appendChild(row);
    });
    el.querySelectorAll(".rm").forEach(function (btn) {
      btn.addEventListener("click", function () { npItemsBuffer.splice(parseInt(btn.dataset.idx, 10), 1); renderNpItems(); });
    });
  }
  document.getElementById("npAddItem").addEventListener("click", function () {
    var sku = document.getElementById("npSku").value.trim();
    var nome = document.getElementById("npNome").value.trim();
    var qtd = parseInt(document.getElementById("npQtd").value, 10) || 1;
    if (!sku) { toast("Informe o SKU", "err"); return; }
    npItemsBuffer.push({ sku: sku, nome: nome, qtd: qtd });
    document.getElementById("npSku").value = "";
    document.getElementById("npNome").value = "";
    document.getElementById("npQtd").value = "1";
    renderNpItems();
  });

  document.getElementById("npSalvar").addEventListener("click", function () {
    var id_externo = document.getElementById("npId").value.trim();
    var canal = document.getElementById("npCanal").value;
    if (!id_externo) { toast("Informe o ID do pedido", "err"); return; }
    if (npItemsBuffer.length === 0) { toast("Adicione ao menos um item", "err"); return; }
    var btn = document.getElementById("npSalvar");
    btn.disabled = true;
    resolverProdutos(npItemsBuffer).then(function (produtoIds) {
      return sb.from("pedidos").insert({ id_externo: id_externo, canal: canal, status: "a_separar" }).select().single().then(function (res) {
        if (res.error) throw res.error;
        var pedidoId = res.data.id;
        var itens = npItemsBuffer.map(function (it, idx) {
          return { pedido_id: pedidoId, produto_id: produtoIds[idx], qtd: it.qtd };
        });
        return sb.from("itens_pedido").insert(itens);
      });
    }).then(function (res) {
      if (res && res.error) throw res.error;
      toast("Pedido " + id_externo + " criado", "ok");
      document.getElementById("npId").value = "";
      npItemsBuffer = [];
      renderNpItems();
      carregarFilaPedidos();
      carregarContadores();
    }).catch(function (err) {
      toast("Erro ao criar pedido: " + (err.message || err), "err");
    }).finally(function () { btn.disabled = false; });
  });

  function resolverProdutos(itens) {
    // Pra cada item, acha o produto pelo SKU ou cria se não existir. Retorna array de produto_id na mesma ordem.
    var promessas = itens.map(function (it) {
      return sb.from("produtos").select("id").eq("sku", it.sku).maybeSingle().then(function (res) {
        if (res.data) return res.data.id;
        return sb.from("produtos").insert({ sku: it.sku, nome: it.nome || it.sku }).select().single().then(function (r2) {
          if (r2.error) throw r2.error;
          return r2.data.id;
        });
      });
    });
    return Promise.all(promessas);
  }

  function carregarFilaPedidos() {
    sb.from("pedidos").select("id,id_externo,canal,status,itens_pedido(qtd)").eq("status", "a_separar").order("criado_em", { ascending: false }).then(function (res) {
      var el = document.getElementById("listaPedidos");
      el.innerHTML = "";
      var lista = res.data || [];
      if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum pedido na fila.</div>'; return; }
      lista.forEach(function (o) {
        var qtdTotal = (o.itens_pedido || []).reduce(function (s, i) { return s + i.qtd; }, 0);
        var row = document.createElement("div");
        row.className = "order-row";
        row.style.cursor = "default";
        row.innerHTML = '<div><div class="oid">' + escapeHtml(o.id_externo) + '</div><div class="meta">' + canalLabel(o.canal) + ' · ' + qtdTotal + ' un.</div></div><span class="badge wait">A separar</span>';
        el.appendChild(row);
      });
    });
  }

  // ---------------- SEPARAÇÃO ----------------
  var sepAtivoId = null;
  function carregarFilaSeparacao() {
    sepAtivoId = null;
    document.getElementById("sepSelectCard").style.display = "";
    document.getElementById("sepAtivo").style.display = "none";
    sb.from("pedidos").select("id,id_externo,canal,itens_pedido(qtd)").eq("status", "a_separar").order("criado_em").then(function (res) {
      var el = document.getElementById("sepFila");
      el.innerHTML = "";
      var lista = res.data || [];
      if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum pedido aguardando separação.</div>'; return; }
      lista.forEach(function (o) {
        var qtdTotal = (o.itens_pedido || []).reduce(function (s, i) { return s + i.qtd; }, 0);
        var row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML = '<div><div class="oid">' + escapeHtml(o.id_externo) + '</div><div class="meta">' + canalLabel(o.canal) + ' · ' + qtdTotal + ' un.</div></div><span class="badge wait">iniciar →</span>';
        row.addEventListener("click", function () { abrirSeparacao(o.id); });
        el.appendChild(row);
      });
    });
  }

  function abrirSeparacao(pedidoId) {
    sepAtivoId = pedidoId;
    document.getElementById("sepSelectCard").style.display = "none";
    document.getElementById("sepAtivo").style.display = "";
    renderFase(pedidoId, "sep");
  }

  // ---------------- EMBALAGEM ----------------
  var embAtivoId = null;
  function carregarFilaEmbalagem() {
    embAtivoId = null;
    document.getElementById("embSelectCard").style.display = "";
    document.getElementById("embAtivo").style.display = "none";
    sb.from("pedidos").select("id,id_externo,canal,itens_pedido(qtd)").eq("status", "separado").order("criado_em").then(function (res) {
      var el = document.getElementById("embFila");
      el.innerHTML = "";
      var lista = res.data || [];
      if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum pedido aguardando embalagem.</div>'; return; }
      lista.forEach(function (o) {
        var qtdTotal = (o.itens_pedido || []).reduce(function (s, i) { return s + i.qtd; }, 0);
        var row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML = '<div><div class="oid">' + escapeHtml(o.id_externo) + '</div><div class="meta">' + canalLabel(o.canal) + ' · ' + qtdTotal + ' un.</div></div><span class="badge sep">embalar →</span>';
        row.addEventListener("click", function () { abrirEmbalagem(o.id); });
        el.appendChild(row);
      });
    });
  }
  function abrirEmbalagem(pedidoId) {
    embAtivoId = pedidoId;
    document.getElementById("embSelectCard").style.display = "none";
    document.getElementById("embAtivo").style.display = "";
    renderFase(pedidoId, "emb");
  }

  // ---------------- FASE COMPARTILHADA (separação / embalagem) ----------------
  var FASE_CFG = {
    sep: { campo: "qtd_separada", tipo: "separacao", proximoStatus: "separado", wrapId: "sepAtivo", voltar: carregarFilaSeparacao },
    emb: { campo: "qtd_embalada", tipo: "embalagem", proximoStatus: "embalado", wrapId: "embAtivo", voltar: carregarFilaEmbalagem }
  };

  function renderFase(pedidoId, fase) {
    var cfg = FASE_CFG[fase];
    sb.from("pedidos").select("id,id_externo,itens_pedido(id,qtd,qtd_separada,qtd_embalada,produtos(sku,nome))").eq("id", pedidoId).single().then(function (res) {
      if (res.error || !res.data) { toast("Erro ao carregar pedido", "err"); return; }
      var pedido = res.data;
      var wrap = document.getElementById(cfg.wrapId);
      var allDone = pedido.itens_pedido.every(function (i) { return i[cfg.campo] >= i.qtd; });
      var html = '<div class="card"><h2>Pedido <span class="mono">' + escapeHtml(pedido.id_externo) + '</span></h2>';
      html += '<div class="scan-box"><input type="text" id="scanInput_' + fase + '" class="mono" placeholder="bipe ou digite o código" autocomplete="off" autocapitalize="off"><div class="scan-hint">Leitor USB/Bluetooth funciona direto. Sem leitor, digite e aperte Enter.</div></div>';
      html += '<div id="itemsList_' + fase + '"></div>';
      html += '<div class="row" style="margin-top:12px"><button class="btn ghost" id="voltar_' + fase + '">← voltar à fila</button><button class="btn primary" id="concluir_' + fase + '" ' + (allDone ? '' : 'disabled') + '>Concluir</button></div></div>';
      wrap.innerHTML = html;

      renderItensFase(pedido.itens_pedido, fase);

      document.getElementById("voltar_" + fase).addEventListener("click", cfg.voltar);
      document.getElementById("concluir_" + fase).addEventListener("click", function () {
        sb.from("pedidos").update({ status: cfg.proximoStatus }).eq("id", pedidoId).then(function (r) {
          if (r.error) { toast("Erro ao concluir: " + r.error.message, "err"); return; }
          toast("Pedido " + pedido.id_externo + " " + statusLabel(cfg.proximoStatus).toLowerCase() + " ✓", "ok");
          cfg.voltar();
        });
      });

      var input = document.getElementById("scanInput_" + fase);
      input.focus();
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          handleScan(pedido, input.value.trim(), fase);
          input.value = "";
        }
      });
    });
  }

  function renderItensFase(itens, fase) {
    var cfg = FASE_CFG[fase];
    var list = document.getElementById("itemsList_" + fase);
    list.innerHTML = "";
    itens.forEach(function (it) {
      var done = it[cfg.campo] >= it.qtd;
      var row = document.createElement("div");
      row.className = "pick-item" + (done ? " done" : "");
      row.id = "item_" + fase + "_" + it.id;
      row.innerHTML =
        '<div class="top"><div><div class="name">' + escapeHtml(it.produtos.nome) + '</div><div class="sku mono">' + escapeHtml(it.produtos.sku) + '</div></div>' +
        '<div class="qty"><span class="' + (done ? "done-c" : "") + '">' + it[cfg.campo] + '</span> / ' + it.qtd + '</div></div>' +
        (done ? '' : '<button class="alerta-btn" data-item="' + it.id + '">reportar falta de estoque</button>');
      list.appendChild(row);
    });
    list.querySelectorAll(".alerta-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { reportarAlerta(btn.dataset.item, btn); });
    });
  }

  function reportarAlerta(itemId, btnEl) {
    sb.from("alertas_estoque").insert({ item_id: itemId, reportado_por: meu.id }).then(function (res) {
      if (res.error) { toast("Erro ao reportar: " + res.error.message, "err"); return; }
      toast("Alerta enviado ao admin", "ok");
      btnEl.outerHTML = '<div class="alerta-tag">⚠ falta reportada</div>';
    });
  }

  function handleScan(pedido, code, fase) {
    if (!code) return;
    var cfg = FASE_CFG[fase];
    var item = pedido.itens_pedido.find(function (i) { return (i.produtos.sku || "").toLowerCase() === code.toLowerCase(); });
    if (!item) { toast("Código não pertence a este pedido", "err"); return; }
    if (item[cfg.campo] >= item.qtd) { toast("Item já conferido (" + item.qtd + "/" + item.qtd + ")", "err"); return; }

    var novoValor = item[cfg.campo] + 1;
    var eraPrimeiro = item[cfg.campo] === 0;
    var patch = {}; patch[cfg.campo] = novoValor;

    sb.from("itens_pedido").update(patch).eq("id", item.id).then(function (res) {
      if (res.error) { toast("Erro ao gravar: " + res.error.message, "err"); return; }
      item[cfg.campo] = novoValor;
      var ficouCompleto = novoValor >= item.qtd;

      // registra evento de tarefa (início na primeira bipagem, fim quando completa)
      if (eraPrimeiro) {
        sb.from("eventos_tarefa").insert({ usuario_id: meu.id, item_id: item.id, tipo: cfg.tipo }).then(function (evRes) {
          if (!evRes.error && ficouCompleto) fecharEvento(item.id, cfg.tipo);
        });
      } else if (ficouCompleto) {
        fecharEvento(item.id, cfg.tipo);
      }

      toast(escapeHtml(item.produtos.nome) + " ✓ " + novoValor + "/" + item.qtd, "ok");
      renderItensFase(pedido.itens_pedido, fase);
      var allDone = pedido.itens_pedido.every(function (i) { return i[cfg.campo] >= i.qtd; });
      document.getElementById("concluir_" + fase).disabled = !allDone;
    });
  }

  function fecharEvento(itemId, tipo) {
    sb.from("eventos_tarefa").update({ finalizado_em: new Date().toISOString() })
      .eq("item_id", itemId).eq("tipo", tipo).eq("usuario_id", meu.id).is("finalizado_em", null).then(function () {});
  }

  // ---------------- EXPEDIÇÃO ----------------
  function carregarFilaExpedicao() {
    sb.from("pedidos").select("id,id_externo,canal,itens_pedido(qtd)").eq("status", "embalado").order("criado_em").then(function (res) {
      var el = document.getElementById("expFila");
      el.innerHTML = "";
      var lista = res.data || [];
      if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum pedido embalado aguardando expedição.</div>'; return; }
      lista.forEach(function (o) {
        var qtdTotal = (o.itens_pedido || []).reduce(function (s, i) { return s + i.qtd; }, 0);
        var row = document.createElement("div");
        row.className = "order-row";
        row.style.cursor = "default";
        row.innerHTML = '<div><div class="oid">' + escapeHtml(o.id_externo) + '</div><div class="meta">' + canalLabel(o.canal) + ' · ' + qtdTotal + ' un.</div></div><button class="btn primary small" data-exp="' + o.id + '">marcar expedido</button>';
        el.appendChild(row);
      });
      el.querySelectorAll("[data-exp]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          sb.from("pedidos").update({ status: "expedido" }).eq("id", btn.dataset.exp).then(function (r) {
            if (r.error) { toast("Erro: " + r.error.message, "err"); return; }
            toast("Pedido expedido ✓", "ok");
            carregarFilaExpedicao();
            carregarContadores();
          });
        });
      });
    });
  }

  // ---------------- PAINEL ----------------
  function carregarPainel() {
    carregarContadores();
    if (meu.papel === "admin") {
      document.getElementById("alertasCard").style.display = "";
      sb.from("alertas_estoque").select("id,resolvido,criado_em,item_id,itens_pedido(produtos(sku,nome),pedido_id,pedidos(id_externo))").eq("resolvido", false).then(function (res) {
        var el = document.getElementById("listaAlertas");
        el.innerHTML = "";
        var lista = res.data || [];
        if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum alerta pendente.</div>'; return; }
        lista.forEach(function (a) {
          var prod = a.itens_pedido && a.itens_pedido.produtos ? a.itens_pedido.produtos : { sku: "?", nome: "?" };
          var ped = a.itens_pedido && a.itens_pedido.pedidos ? a.itens_pedido.pedidos.id_externo : "?";
          var row = document.createElement("div");
          row.className = "order-row";
          row.style.cursor = "default";
          row.innerHTML = '<div><div class="oid">' + escapeHtml(prod.nome) + '</div><div class="meta mono">' + escapeHtml(prod.sku) + ' · pedido ' + escapeHtml(ped) + '</div></div><button class="btn small" data-res="' + a.id + '">resolver</button>';
          el.appendChild(row);
        });
        el.querySelectorAll("[data-res]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            sb.from("alertas_estoque").update({ resolvido: true }).eq("id", btn.dataset.res).then(function () { carregarPainel(); });
          });
        });
      });
    } else {
      document.getElementById("alertasCard").style.display = "none";
    }

    if (meu.papel === "admin") {
      sb.from("pedidos").select("id_externo,canal,status,criado_em,itens_pedido(qtd)").order("criado_em", { ascending: false }).limit(50).then(function (res) {
        var el = document.getElementById("painelLista");
        el.innerHTML = "";
        var lista = res.data || [];
        if (lista.length === 0) { el.innerHTML = '<div class="empty">Nenhum pedido cadastrado ainda.</div>'; return; }
        lista.forEach(function (o) {
          var qtdTotal = (o.itens_pedido || []).reduce(function (s, i) { return s + i.qtd; }, 0);
          var row = document.createElement("div");
          row.className = "order-row";
          row.style.cursor = "default";
          row.innerHTML = '<div><div class="oid">' + escapeHtml(o.id_externo) + '</div><div class="meta">' + canalLabel(o.canal) + ' · ' + qtdTotal + ' un.</div></div><span class="badge ' + statusBadge(o.status) + '">' + statusLabel(o.status) + '</span>';
          el.appendChild(row);
        });
      });
    } else {
      document.getElementById("painelLista").innerHTML = '<div class="empty">Detalhes de todos os pedidos são visíveis só pro admin.</div>';
    }
  }
})();
</script>
</body>
</html>
